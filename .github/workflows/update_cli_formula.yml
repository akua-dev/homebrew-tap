name: Update verified public release formula

on:
  repository_dispatch:
    types: [akua-cli-release-published, akuapkg-release-published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-formula-${{ github.event.action }}-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORMULA: ${{ github.event.action == 'akua-cli-release-published' && 'akua' || 'akuapkg' }}
      VERSION: ${{ github.event.client_payload.version }}
      TAG: ${{ github.event.client_payload.tag }}
      RELEASE_URL: ${{ github.event.client_payload.release_url }}
      MANIFEST_URL: ${{ github.event.client_payload.homebrew_manifest_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the published formula manifest
        run: curl --fail --location --proto '=https' --tlsv1.2 "$MANIFEST_URL" --output "$RUNNER_TEMP/release-homebrew.json"
      - name: Validate the release and render the formula
        run: |
          ruby scripts/update_formula.rb \
            --formula "$FORMULA" \
            --version "$VERSION" \
            --tag "$TAG" \
            --release-url "$RELEASE_URL" \
            --manifest-url "$MANIFEST_URL" \
            --manifest "$RUNNER_TEMP/release-homebrew.json" \
            --output "Formula/$FORMULA.rb"
      - name: Test the tap contracts
        run: ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - name: Open the tested formula update
        id: formula_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: automation/${{ env.FORMULA }}-${{ github.event.client_payload.version }}
          delete-branch: true
          add-paths: Formula/${{ env.FORMULA }}.rb
          commit-message: "chore: update ${{ env.FORMULA }} to v${{ github.event.client_payload.version }}"
          title: "chore: update ${{ env.FORMULA }} to v${{ github.event.client_payload.version }}"
          body: |
            Generated from the verified release manifest for ${{ github.event.client_payload.release_url }}.

            The formula is merged automatically after the tap contracts pass, with the tested pull request head fixed by SHA.
      - name: Merge the tested formula update
        if: ${{ success() && steps.formula_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.formula_pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.formula_pr.outputs.pull-request-head-sha }}
        run: |
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh pr merge "$PR_NUMBER" --repo akua-dev/homebrew-tap --squash --match-head-commit "$PR_HEAD_SHA"
